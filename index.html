<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:15px;
}

p{
    color:white;
    font-size:1.2rem;
    margin-bottom:30px;
}

.buttons{
    position:relative;
    width:500px;
    height:250px;
    margin:auto;
}

button{
    border:none;
    cursor:pointer;
    transition:0.4s;
}

#acceptBtn{
    background:#28a745;
    color:white;
    padding:15px 40px;
    border-radius:50px;
    font-size:20px;
}

#noBtn{
    position:absolute;
    background:#dc3545;
    color:white;
    padding:15px 35px;
    border-radius:50px;
    font-size:18px;
    left:280px;
    top:0;
}

.grow{
    transform:scale(1.6);
    font-size:28px !important;
}
</style>
</head>

<body>

<div class="container">
    <h1>🥺 I'm Really Sorry</h1>
    <p>Please accept my apology ❤️</p>

    <div class="buttons">
        <button id="acceptBtn">Accept My Sorry ❤️</button>
        <button id="noBtn">Not Acceptable 😒</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const acceptBtn = document.getElementById("acceptBtn");

let count = 0;

const positions = [
    {left:"350px", top:"120px"},
    {left:"50px", top:"170px"},
    {left:"380px", top:"20px"},
    {left:"120px", top:"20px"},
    {left:"250px", top:"180px"}
];

noBtn.addEventListener("click", () => {

    if(count < positions.length){
        noBtn.style.left = positions[count].left;
        noBtn.style.top = positions[count].top;
        count++;
    } else {
        noBtn.style.display = "none";
        acceptBtn.classList.add("grow");
        acceptBtn.innerHTML = "❤️ Please Click Here ❤️";
    }
});

acceptBtn.addEventListener("click", () => {
    document.body.innerHTML = `
    <div style="
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    color:white;
    text-align:center;">
    
    <h1 style="font-size:60px;">❤️ Thank You ❤️</h1>
    <h2>I Knew You Would Accept My Sorry 🥺</h2>
    
    </div>`;
});
</script>

</body>
</html>
